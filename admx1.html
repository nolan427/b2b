<!DOCTYPE html>
<html>
<head>
  <title>Styled Redis Admin Panel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #f5f6fa;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 12px;
      color: #232528;
    }
    #loginBox {
      background: #fff;
      padding:32px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 24px #bbb4;
      max-width: 340px;
      margin: 80px auto 0;
    }
    h1, h2 {
      color: #304ffe;
      margin-top: 0.8em;
      margin-bottom: 0.5em;
    }
    form label {
      font-weight: bold;
      color: #4860c6;
    }
    input, button, select {
      width: 100%;
      font-size: 1.1em;
      border: 1px solid #c8d0da;
      border-radius: 5px;
      margin: 0.3em 0 1em 0;
      padding: 0.6em;
      box-sizing: border-box;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #7a93e8;
      outline: none;
    }
    button {
      background: #304ffe;
      color: #fff;
      border: none;
      font-weight: bold;
      box-shadow: 0 2px 8px #a2acf6;
      cursor: pointer;
      margin-top: 0.2em;
      padding: 0.7em;
      width: auto;
      min-width: 120px;
      transition: background 0.15s;
    }
    button:hover {
      background: #1a237e;
    }
    #adminPanel {
      animation: fadein 0.5s;
    }
    @keyframes fadein {
      from { opacity: 0;}
      to   { opacity: 1;}
    }
    hr {
      border: 0;
      border-top: 1px solid #dee1e6;
      margin: 2em 0;
    }
    .form-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .form-col {
      flex: 1 1 120px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 24px #bbb2;
      border-radius: 8px;
      overflow: hidden;
      font-size: 1em;
      margin-top: 8px;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 12px;
      text-align: left;
    }
    th {
      background: #dee7ff;
      color: #3f51b5;
      font-weight: bold;
    }
    tr:last-child td {border-bottom: none;}
    tr.selected {background:#fffde7;}
    tr.deleted {background:#ffebee;}
    a {color:#2577d4;}
    .action-btn {
      background: #8c9eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 9px;
      margin:0 3px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .action-btn:hover {background:#536dfe;}
    #searchKey {
      width:65%;
      min-width:130px;
      margin:0 8px 10px 0;
    }

    /* ========== TABS STYLES ========== */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #dee1e6;
    }
    .tab-btn {
      background: transparent;
      color: #666;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1em;
      transition: all 0.2s;
      box-shadow: none;
      margin: 0;
    }
    .tab-btn:hover {
      background: #f5f6fa;
      color: #304ffe;
    }
    .tab-btn.active {
      color: #304ffe;
      border-bottom-color: #304ffe;
      background: transparent;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* ========== VISITS STYLES ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #bbb3;
      border-left: 4px solid #304ffe;
    }
    .stat-card h3 {
      margin: 0 0 8px 0;
      color: #666;
      font-size: 0.9em;
      font-weight: 600;
      text-transform: uppercase;
    }
    .stat-card .stat-value {
      font-size: 2em;
      font-weight: 700;
      color: #304ffe;
      margin: 0;
    }
    .key-accordion {
      background: #fff;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px #bbb2;
      overflow: hidden;
    }
    .key-accordion-header {
      padding: 16px 20px;
      cursor: pointer;
      background: #f8f9fa;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .key-accordion-header:hover {
      background: #e9ecef;
    }
    .key-accordion-header.active {
      background: #dee7ff;
    }
    .key-info {
      flex: 1;
    }
    .key-name {
      font-weight: 700;
      font-size: 1.1em;
      color: #304ffe;
      margin-bottom: 4px;
    }
    .key-stats {
      font-size: 0.9em;
      color: #666;
    }
    .key-stats span {
      margin-right: 16px;
    }
    .expand-icon {
      font-size: 1.2em;
      color: #999;
      transition: transform 0.2s;
    }
    .expand-icon.expanded {
      transform: rotate(180deg);
    }
    .key-accordion-content {
      display: none;
      padding: 0;
    }
    .key-accordion-content.active {
      display: block;
    }
    .visits-table {
      font-size: 0.95em;
    }
    .visits-table th {
      background: #f8f9fa;
      color: #666;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 600;
    }
    .badge-office365 {
      background: #E8F3FF;
      color: #0078D4;
    }
    .badge-google {
      background: #E8F5E9;
      color: #34A853;
    }
    .badge-other {
      background: #FFF3E0;
      color: #F57C00;
    }
    .badge-desktop {
      background: #E3F2FD;
      color: #1976D2;
    }
    .badge-mobile {
      background: #F3E5F5;
      color: #7B1FA2;
    }
    .badge-tablet {
      background: #FFF9C4;
      color: #F57F17;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 16px;
    }

    @media (max-width:768px) {
      table, .form-row {font-size: 0.98em;}
      #loginBox, #adminPanel {padding: 6px;}
      h1,h2 {font-size:1.1em;}
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .tab-btn {
        padding: 10px 16px;
        font-size: 0.95em;
      }
      .key-accordion-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="text" id="loginUser" placeholder="Username">
  <input type="password" id="loginPass" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="loginMsg" style="color:red"></div>
</div>

<div id="adminPanel" style="display:none;">
  <h1>Redis Document Admin</h1>
  <button onclick="logout()" style="float:right;margin:1em;background:#ccc;color:#444;box-shadow:none;">Logout</button>

  <!-- ========== TABS ========== -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('documents')">📄 Documents</button>
    <button class="tab-btn" onclick="switchTab('visits')">📊 Visits</button>
  </div>

  <!-- ========== DOCUMENTS TAB ========== -->
  <div id="documentsTab" class="tab-content active">
    <h2>Add / Edit Document</h2>
    <form id="editForm" onsubmit="saveDoc(event)">
      <div class="form-row">
        <div class="form-col"><label>Key
          <input id="editKey" name="key" required></label></div>
        <div class="form-col"><label>Sender
          <input id="editSender" name="sender" required></label></div>
        <div class="form-col"><label>Title
          <input id="editTitle" name="title" required></label></div>
        <div class="form-col"><label>URL
          <input id="editUrl" name="url" required></label></div>
      </div>
      <button type="submit">Save</button>
      <button id="cancelEditBtn" type="button" onclick="clearForm()" style="display:none;background:#f1f1f1;color:#888;box-shadow:none;">Cancel</button>
    </form>
    <hr>
    <h2>Database Entries</h2>
    <input id="searchKey" placeholder="Filter by key/any field..." oninput="renderTable()">
    <button onclick="fetchAll()">Refresh</button>
    <table id="docTable">
      <thead>
        <tr><th>Key</th><th>Sender</th><th>Title</th><th>URL</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ========== VISITS TAB ========== -->
  <div id="visitsTab" class="tab-content">
    <h2>Visitor Analytics</h2>
    <button onclick="fetchVisits()" style="margin-bottom:16px;">Refresh Visits</button>
    
    <div id="visitsLoading" class="loading" style="display:none;">
      Loading visits data...
    </div>

    <div id="visitsContent" style="display:none;">
      <!-- Stats Cards -->
      <div class="stats-grid" id="visitsStats"></div>

      <!-- Search Filter -->
      <input id="searchVisits" placeholder="Filter by document key, email, IP..." oninput="filterVisits()" style="margin-bottom:16px;">

      <!-- Visits by Key -->
      <div id="visitsByKey"></div>
    </div>

    <div id="visitsEmpty" class="empty-state" style="display:none;">
      <div class="empty-state-icon">📊</div>
      <h3>No Visits Yet</h3>
      <p>Visit data will appear here once users access documents.</p>
    </div>
  </div>
</div>

<script>
// ========== EXISTING CODE ==========
const USERNAME = "admin";
const PASSWORD = "0987"; // Change

function login(){
  let u = document.getElementById('loginUser').value;
  let p = document.getElementById('loginPass').value;
  if(u === USERNAME && p === PASSWORD){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='';
    fetchAll();
  } else {
    document.getElementById('loginMsg').textContent = "Invalid credentials";
  }
}
function logout(){
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('loginBox').style.display='';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}
let docStore = {};
async function fetchAll(){
  let r = await fetch('/api/storage.php?action=list');
  let res = await r.json();
  if(res.success){
    docStore = res.docs || {};
    renderTable();
  }
}
function renderTable(){
  let tb = document.getElementById('docTable').querySelector('tbody');
  tb.innerHTML = '';
  let q = document.getElementById('searchKey').value.trim().toLowerCase();
  let keys = Object.keys(docStore);
  keys.sort();
  for(let k of keys){
    let row = docStore[k];
    let show = !q || k.toLowerCase().includes(q) ||
      (row.sender && row.sender.toLowerCase().includes(q)) ||
      (row.title && row.title.toLowerCase().includes(q)) ||
      (row.url && row.url.toLowerCase().includes(q));
    if(!show) continue;
    let tr = tb.insertRow();
    tr.insertCell().textContent = k;
    tr.insertCell().textContent = row.sender||"";
    tr.insertCell().textContent = row.title||"";
    tr.insertCell().innerHTML = row.url?(`<a href="${row.url}" target="_blank">${row.url}</a>`):"";
    tr.insertCell().innerHTML = `
      <button class="action-btn" onclick="editDoc('${k}')">Edit</button>
      <button class="action-btn" onclick="delDoc('${k}')">Delete</button>
    `;
  }
}
async function editDoc(k){
  const doc = docStore[k];
  document.getElementById('editKey').value = k;
  document.getElementById('editSender').value = doc.sender||"";
  document.getElementById('editTitle').value = doc.title||"";
  document.getElementById('editUrl').value = doc.url||"";
  document.getElementById('editKey').readOnly = true;
  document.getElementById('cancelEditBtn').style.display='inline-block';
}
function clearForm(){
  document.getElementById('editKey').value = "";
  document.getElementById('editSender').value = "";
  document.getElementById('editTitle').value = "";
  document.getElementById('editUrl').value = "";
  document.getElementById('editKey').readOnly = false;
  document.getElementById('cancelEditBtn').style.display='none';
}
async function saveDoc(e){
  e.preventDefault();
  const f = e.target;
  let params = `key=${encodeURIComponent(f.key.value)}&sender=${encodeURIComponent(f.sender.value)}&title=${encodeURIComponent(f.title.value)}&url=${encodeURIComponent(f.url.value)}`;
  let r = await fetch(`/api/storage.php?action=set&${params}`);
  let res = await r.json();
  if(res.success){ clearForm(); fetchAll(); }
  else alert("Failed: "+(res.error || "unknown"));
}
async function delDoc(k){
  if(!confirm("Delete key "+k+"? This cannot be undone.")) return;
  let r = await fetch(`/api/storage.php?action=delete&key=${encodeURIComponent(k)}`);
  let res = await r.json();
  if(res.success){ fetchAll(); }
  else alert("Delete error: "+(res.error||"unknown"));
}
document.getElementById('loginBox').addEventListener('keydown', function(e){
  if(e.key==='Enter')login();
});

// ========== NEW TABS CODE ==========
function switchTab(tabName) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  // Show selected tab
  if(tabName === 'documents') {
    document.getElementById('documentsTab').classList.add('active');
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
  } else if(tabName === 'visits') {
    document.getElementById('visitsTab').classList.add('active');
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    // Load visits if not already loaded
    if(!visitsData) {
      fetchVisits();
    }
  }
}

// ========== VISITS CODE ==========
let visitsData = null;
let filteredVisitsData = null;

async function fetchVisits() {
  document.getElementById('visitsLoading').style.display = 'block';
  document.getElementById('visitsContent').style.display = 'none';
  document.getElementById('visitsEmpty').style.display = 'none';

  try {
    // Change from /api/get-visits to /api/get-visits.php
    const response = await fetch('/api/get-visits.php');
    const data = await response.json();

    if(data.success) {
      visitsData = data;
      filteredVisitsData = data;
      
      if(data.total_visits === 0) {
        document.getElementById('visitsLoading').style.display = 'none';
        document.getElementById('visitsEmpty').style.display = 'block';
      } else {
        renderVisits(data);
        document.getElementById('visitsLoading').style.display = 'none';
        document.getElementById('visitsContent').style.display = 'block';
      }
    } else {
      console.error('API Error:', data);
      alert('Error loading visits: ' + (data.error || 'Unknown error'));
      document.getElementById('visitsLoading').style.display = 'none';
    }
  } catch(error) {
    console.error('Fetch error:', error);
    alert('Failed to load visits data: ' + error.message);
    document.getElementById('visitsLoading').style.display = 'none';
  }
}

function renderVisits(data) {
  // Render stats
  renderVisitsStats(data);
  
  // Render visits by key
  renderVisitsByKey(data.visits_by_key);
}

function renderVisitsStats(data) {
  const statsDiv = document.getElementById('visitsStats');
  
  // Calculate device percentages
  const deviceBreakdown = data.device_breakdown || {};
  const mxBreakdown = data.mx_type_breakdown || {};
  
  statsDiv.innerHTML = `
    <div class="stat-card">
      <h3>Total Visits</h3>
      <p class="stat-value">${data.total_visits || 0}</p>
    </div>
    <div class="stat-card" style="border-left-color: #34A853;">
      <h3>Document Keys</h3>
      <p class="stat-value">${data.total_keys || 0}</p>
    </div>
    <div class="stat-card" style="border-left-color: #F57C00;">
      <h3>Desktop</h3>
      <p class="stat-value">${deviceBreakdown.Desktop || 0}</p>
    </div>
    <div class="stat-card" style="border-left-color: #7B1FA2;">
      <h3>Mobile</h3>
      <p class="stat-value">${deviceBreakdown.Mobile || 0}</p>
    </div>
    <div class="stat-card" style="border-left-color: #0078D4;">
      <h3>Office 365</h3>
      <p class="stat-value">${mxBreakdown.office365 || 0}</p>
    </div>
    <div class="stat-card" style="border-left-color: #34A853;">
      <h3>Google</h3>
      <p class="stat-value">${mxBreakdown.google || 0}</p>
    </div>
  `;
}

function renderVisitsByKey(visitsByKey) {
  const container = document.getElementById('visitsByKey');
  
  if(!visitsByKey || Object.keys(visitsByKey).length === 0) {
    container.innerHTML = '<div class="empty-state"><p>No visits data available</p></div>';
    return;
  }

  let html = '';
  const keys = Object.keys(visitsByKey).sort();

  for(const key of keys) {
    const keyData = visitsByKey[key];
    html += `
      <div class="key-accordion" data-key="${key}">
        <div class="key-accordion-header" onclick="toggleKeyAccordion('${key}')">
          <div class="key-info">
            <div class="key-name">${key}</div>
            <div class="key-stats">
              <span>📊 ${keyData.total_visits} visits</span>
              <span>👤 ${keyData.unique_visitors} unique</span>
            </div>
          </div>
          <div class="expand-icon">▼</div>
        </div>
        <div class="key-accordion-content" id="accordion-${key}">
          ${renderVisitsTable(keyData.visits)}
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

function renderVisitsTable(visits) {
  if(!visits || visits.length === 0) {
    return '<p style="padding:20px;text-align:center;color:#999;">No visits recorded</p>';
  }

  let html = `
    <table class="visits-table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Email</th>
          <th>IP Address</th>
          <th>Device</th>
          <th>MX Type</th>
        </tr>
      </thead>
      <tbody>
  `;

  for(const visit of visits) {
    const date = new Date(visit.timestamp);
    const formattedDate = date.toLocaleString();
    
    const deviceBadge = getDeviceBadge(visit.device);
    const mxBadge = getMxBadge(visit.mx_type);

    html += `
      <tr>
        <td>${formattedDate}</td>
        <td>${visit.email}</td>
        <td>${visit.ip}</td>
        <td>${deviceBadge}</td>
        <td>${mxBadge}</td>
      </tr>
    `;
  }

  html += '</tbody></table>';
  return html;
}

function getDeviceBadge(device) {
  const classes = {
    'Desktop': 'badge-desktop',
    'Mobile': 'badge-mobile',
    'Tablet': 'badge-tablet'
  };
  const className = classes[device] || 'badge-desktop';
  return `<span class="badge ${className}">${device || 'Desktop'}</span>`;
}

function getMxBadge(mxType) {
  const types = {
    'office365': { label: 'Office 365', class: 'badge-office365' },
    'google': { label: 'Google', class: 'badge-google' },
    'other': { label: 'Other', class: 'badge-other' }
  };
  const type = types[mxType] || types.other;
  return `<span class="badge ${type.class}">${type.label}</span>`;
}

function toggleKeyAccordion(key) {
  const accordion = document.querySelector(`[data-key="${key}"]`);
  const content = document.getElementById(`accordion-${key}`);
  const header = accordion.querySelector('.key-accordion-header');
  const icon = header.querySelector('.expand-icon');

  const isActive = content.classList.contains('active');

  // Close all accordions
  document.querySelectorAll('.key-accordion-content').forEach(el => {
    el.classList.remove('active');
  });
  document.querySelectorAll('.key-accordion-header').forEach(el => {
    el.classList.remove('active');
  });
  document.querySelectorAll('.expand-icon').forEach(el => {
    el.classList.remove('expanded');
  });

  // Toggle current accordion
  if(!isActive) {
    content.classList.add('active');
    header.classList.add('active');
    icon.classList.add('expanded');
  }
}

function filterVisits() {
  if(!visitsData) return;

  const query = document.getElementById('searchVisits').value.trim().toLowerCase();
  
  if(!query) {
    renderVisits(visitsData);
    return;
  }

  // Filter visits by key
  const filteredByKey = {};
  
  for(const [key, keyData] of Object.entries(visitsData.visits_by_key)) {
    const filteredVisits = keyData.visits.filter(visit => {
      return key.toLowerCase().includes(query) ||
             visit.email.toLowerCase().includes(query) ||
             visit.ip.includes(query) ||
             visit.device.toLowerCase().includes(query) ||
             visit.mx_type.toLowerCase().includes(query);
    });

    if(filteredVisits.length > 0) {
      filteredByKey[key] = {
        total_visits: filteredVisits.length,
        unique_visitors: new Set(filteredVisits.map(v => v.email)).size,
        visits: filteredVisits
      };
    }
  }

  renderVisitsByKey(filteredByKey);
}
</script>
</body>
</html>
