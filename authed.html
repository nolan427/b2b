<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Document Cloud - Authentication Success</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFBFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2C2C2C;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid #E8E8E8;
        }

        .logo-container {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-mark {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #FA0F00 0%, #D10000 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(250, 15, 0, 0.25);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
            color: #2C2C2C;
            letter-spacing: -0.3px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            border: 2px solid #BBF7D0;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .spinner-container {
            margin: 32px 0;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #F0F0F0;
            border-top: 4px solid #FA0F00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            font-size: 14px;
            color: #999999;
            margin-top: 16px;
            padding: 12px 20px;
            background: #F8F9FA;
            border-radius: 8px;
            font-weight: 500;
        }

        .status-icon {
            display: inline-block;
            margin-right: 6px;
        }

        .error {
            background: #FEF2F2;
            color: #DC2626;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #FEE2E2;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #F0F0F0;
            font-size: 12px;
            color: #999999;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Adobe Logo -->
        <div class="logo-container">
            <div class="logo-mark">A</div>
            <div class="logo-text">
                <div class="logo-title">Adobe Document Cloud</div>
                <div class="logo-subtitle">Secure Access Portal</div>
            </div>
        </div>

        <!-- Success Icon -->
        <div class="success-icon" id="successIcon">✅</div>

        <!-- Heading -->
        <h1 id="heading">Authentication Successful</h1>
        <p class="subtitle" id="subtitle">
            You have been successfully authenticated. Redirecting to your document...
        </p>

        <!-- Spinner -->
        <div class="spinner-container">
            <div class="spinner" id="spinner"></div>
        </div>

        <!-- Status Message -->
        <div class="status" id="status">
            <span class="status-icon">🔄</span>
            <span>Processing authentication...</span>
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2024 Adobe Inc. All rights reserved.
        </div>
    </div>

    <script>
        // ========== COOKIE UTILITIES ==========
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/";
            console.log(`Cookie set: ${name} = ${value}`);
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return null;
        }

        // ========== UPDATE UI ==========
        function updateStatus(icon, message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<span class="status-icon">${icon}</span><span>${message}</span>`;
        }

        function showError(message) {
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = '<strong>⚠️ Error:</strong> ' + message;
            
            // Update icon and text
            document.getElementById('successIcon').innerHTML = '❌';
            document.getElementById('successIcon').style.background = 'linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%)';
            document.getElementById('successIcon').style.borderColor = '#FECACA';
            document.getElementById('heading').textContent = 'Authentication Error';
            document.getElementById('subtitle').textContent = 'There was a problem completing authentication.';
            
            // Remove spinner
            document.getElementById('spinner').style.display = 'none';
            
            container.insertBefore(errorDiv, document.getElementById('footer'));
        }

        // ========== MAIN AUTHENTICATION FLOW ==========
        async function processAuthentication() {
            try {
                console.log('🔐 Starting authentication process...');

                // Step 1: Set authenticated cookie
                updateStatus('🔐', 'Setting authentication cookie...');
                await new Promise(resolve => setTimeout(resolve, 500));
                
                setCookie('authenticated', 'yes', 365);
                console.log('✅ Authentication cookie set: authenticated=yes');

                // Step 2: Get redirect URL from cookie
                updateStatus('📋', 'Retrieving document URL...');
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const redirectUrl = getCookie('redirect_url');
                console.log('📋 Retrieved redirect_url cookie:', redirectUrl);

                if (!redirectUrl) {
                    throw new Error('No redirect URL found. Please try accessing the document again.');
                }

                // Step 3: Validate URL
                updateStatus('✓', 'Validating destination...');
                await new Promise(resolve => setTimeout(resolve, 500));

                try {
                    new URL(redirectUrl); // Validate URL format
                } catch (e) {
                    throw new Error('Invalid redirect URL format.');
                }

                // Step 4: Success - prepare to redirect
                updateStatus('🚀', 'Authentication complete! Redirecting...');
                console.log('🚀 Redirecting to:', redirectUrl);

                // Wait a moment to show success
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Step 5: Redirect
                console.log('➡️ Performing redirect...');
                window.location.href = redirectUrl;

            } catch (error) {
                console.error('❌ Authentication error:', error);
                showError(error.message || 'An unexpected error occurred.');
                updateStatus('❌', 'Authentication failed');
            }
        }

        // ========== START ON PAGE LOAD ==========
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 Authenticated.html loaded');
            console.log('🍪 Current cookies:', document.cookie);
            
            // Start authentication process
            processAuthentication();
        });
    </script>
</body>
</html>
