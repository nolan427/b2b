<!DOCTYPE html>
<html>
<head>
    <title>Storage Lookup</title>
</head>
<body>
    <h1>Data Lookup</h1>
    <p>Key: <span id="key"></span></p>
    <p>Value: <span id="value"></span></p>
    <input type="text" id="newValue" placeholder="Enter new value">
    <button onclick="saveValue()">Save</button>

    <script>
        function fetchValue() {
            const key = window.location.hash.substring(1);
            document.getElementById('key').textContent = key;
            const value = localStorage.getItem(key);
            document.getElementById('value').textContent = value || 'Not found';
        }

        function saveValue() {
            const key = window.location.hash.substring(1);
            const value = document.getElementById('newValue').value;
            localStorage.setItem(key, value);
            fetchValue();
        }

        fetchValue();
        window.addEventListener('hashchange', fetchValue);
    </script>
</body>
</html>
