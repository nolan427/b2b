<!DOCTYPE html>
<html>
<head>
    <title>Storage Lookup</title>
</head>
<body>
    <h1>Data Lookup</h1>
    <p>Key: <span id="key"></span></p>
    <p>Value: <span id="value"></span></p>
    <script>
        async function fetchValue() {
            const key = window.location.hash.substring(1);
            document.getElementById('key').textContent = key || '[NONE]';
            if (!key) {
                document.getElementById('value').textContent = "No key provided";
                return;
            }
            try {
                const resp = await fetch(`/api/storage.php?action=get&key=${encodeURIComponent(key)}`);
                const data = await resp.json();
                document.getElementById('value').textContent = data.success ? (data.value ?? '[null]') : `Error: ${data.error || 'Unknown error'}`;
            } catch (e) {
                document.getElementById('value').textContent = 'Fetch error: ' + e;
            }
        }
        window.addEventListener('hashchange', fetchValue);
        fetchValue(); // Run once on load
    </script>
</body>
</html>
